name: Check Markdown links

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  check-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: scripts/check.sh
